
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>365</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #030916;
    color: white;
    font-family: Georgia, serif;
    touch-action: none;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: grab;
}

canvas:active {
    cursor: grabbing;
}

.controls {
    position: fixed;
    right: 20px;
    bottom: 22px;
    display: flex;
    gap: 9px;
    z-index: 3;
}

.controls button {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(150,190,235,.25);
    border-radius: 50%;
    background: rgba(9,23,43,.8);
    color: #c9e4ff;
    font-size: 19px;
    cursor: pointer;
    backdrop-filter: blur(8px);
}

.modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(1,6,17,.78);
    backdrop-filter: blur(9px);
    z-index: 5;
}

.modal.show {
    display: flex;
}

.card {
    position: relative;
    width: 100%;
    max-width: 390px;
    padding: 52px 30px 45px;
    text-align: center;
    background:
        radial-gradient(ellipse at 50% 0%, rgba(53,100,157,.18), transparent 65%),
        #09172a;
    border: 1px solid rgba(145,190,235,.28);
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(65,135,210,.12);
    animation: appear .25s ease;
    max-height: 85vh;
    overflow-y: auto;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.exit {
    position: absolute;
    top: 13px;
    right: 16px;
    border: none;
    background: transparent;
    color: #9bb8d8;
    font-family: Arial, sans-serif;
    font-size: 25px;
    font-weight: 200;
    cursor: pointer;
}

.number {
    color: #82baff;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 27px;
}

.reason {
    color: #e1edfc;
    font-size: 23px;
    line-height: 1.7;
    font-weight: normal;
}

.star-decoration {
    margin-top: 30px;
    color: #8ec5ff;
    font-size: 20px;
    text-shadow: 0 0 15px #65b3ff;
}

.moon-icon {
    font-size: 55px;
    color: #dcecff;
    margin-bottom: 22px;
    text-shadow: 0 0 30px rgba(135,190,255,.65);
}

.progress-count {
    color: #dcecff;
    font-size: 21px;
    margin-bottom: 22px;
}

.progress-bar {
    width: 100%;
    height: 3px;
    background: #1c304b;
    margin-bottom: 25px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #83c5ff;
    transition: width .3s;
    box-shadow: 0 0 12px #64baff;
}

.letter {
    color: #dce9fa;
    font-size: 17px;
    line-height: 1.9;
    white-space: pre-wrap;
    text-align: left;
    margin-top: 15px;
}

.unlock {
    margin-top: 10px;
    padding: 12px 24px;
    border: 1px solid #537eae;
    background: rgba(72,135,195,.12);
    color: #c9e4ff;
    font-family: Georgia, serif;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
}

.unlock:disabled {
    opacity: .35;
    cursor: default;
}

</style>
</head>

<body>

<canvas id="sky"></canvas>

<div class="controls">
    <button id="zoomOut">−</button>
    <button id="zoomIn">+</button>
    <button id="home">⌂</button>
</div>

<div class="modal" id="modal">
    <div class="card" id="card"></div>
</div>

<script>
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");

const reasons = Array.from({ length: 365 }, () =>
    "PLACEHOLDER"
);

const anniversaryLetter = "PLACEHOLDER";

const world = {
    width: 3600,
    height: 2600
};

const camera = {
    x: world.width / 2,
    y: world.height / 2,
    zoom: 1
};

let width, height;
let stars = [];
let discovered = new Set();

let seed = 12345;

function random() {
    seed = (seed * 16807) % 2147483647;
    return (seed - 1) / 2147483646;
}

function wrap(value, max) {
    return ((value % max) + max) % max;
}

function distance(a, b) {
    let dx = Math.abs(a.x - b.x);
    let dy = Math.abs(a.y - b.y);

    dx = Math.min(dx, world.width - dx);
    dy = Math.min(dy, world.height - dy);

    return Math.sqrt(dx * dx + dy * dy);
}

function generateStars() {
    stars = [];

    const columns = 20;
    const rows = 19;
    const cellWidth = world.width / columns;
    const cellHeight = world.height / rows;

    const positions = [];

    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < columns; x++) {
            positions.push({ x, y });
        }
    }

    for (let i = positions.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [positions[i], positions[j]] = [positions[j], positions[i]];
    }

    for (const cell of positions) {
        if (stars.length >= 365) break;

        let candidate = {
            x: (cell.x + .5 + (random() - .5) * .65) * cellWidth,
            y: (cell.y + .5 + (random() - .5) * .65) * cellHeight
        };

        if (distance(candidate, {
            x: world.width / 2,
            y: world.height / 2
        }) < 155) {
            continue;
        }

        stars.push(candidate);
    }

    while (stars.length < 365) {
        const candidate = {
            x: random() * world.width,
            y: random() * world.height
        };

        if (distance(candidate, {
            x: world.width / 2,
            y: world.height / 2
        }) < 155) continue;

        let nearest = Infinity;

        for (const star of stars) {
            nearest = Math.min(nearest, distance(candidate, star));
        }

        if (nearest > 65) stars.push(candidate);
    }

    stars.forEach(star => {
        star.radius = 2 + random() * 1.7;
        star.brightness = .65 + random() * .35;
        star.phase = random() * Math.PI * 2;
        star.speed = .6 + random() * 1.4;
        star.rotation = random() * Math.PI;
    });
}

generateStars();

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);

function drawBackground() {
    ctx.fillStyle = "#030916";
    ctx.fillRect(0, 0, width, height);

    const glow = ctx.createRadialGradient(
        width * .48, height * .48, 0,
        width * .48, height * .48, width * .8
    );

    glow.addColorStop(0, "rgba(24,65,120,.19)");
    glow.addColorStop(.5, "rgba(10,34,70,.08)");
    glow.addColorStop(1, "rgba(3,9,22,0)");

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);

    const glow2 = ctx.createRadialGradient(
        width * .85, height * .85, 0,
        width * .85, height * .85, width * .5
    );

    glow2.addColorStop(0, "rgba(31,78,135,.09)");
    glow2.addColorStop(1, "rgba(3,9,22,0)");

    ctx.fillStyle = glow2;
    ctx.fillRect(0, 0, width, height);
}

function worldDifference(a, b, size) {
    return wrap(a - b + size / 2, size) - size / 2;
}

function drawFourPointStar(x, y, radius, color, alpha) {
    ctx.save();
    ctx.translate(x, y);

    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;

    ctx.beginPath();
    ctx.moveTo(0, -radius * 2.5);
    ctx.quadraticCurveTo(radius * .16, -radius * .16, radius * 2.5, 0);
    ctx.quadraticCurveTo(radius * .16, radius * .16, 0, radius * 2.5);
    ctx.quadraticCurveTo(-radius * .16, radius * .16, -radius * 2.5, 0);
    ctx.quadraticCurveTo(-radius * .16, -radius * .16, 0, -radius * 2.5);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

function drawStar(star, index) {
    const dx = worldDifference(star.x, camera.x, world.width);
    const dy = worldDifference(star.y, camera.y, world.height);

    const x = width / 2 + dx * camera.zoom;
    const y = height / 2 + dy * camera.zoom;

    if (
        x < -30 || x > width + 30 ||
        y < -30 || y > height + 30
    ) return;

    const time = performance.now() / 1000;
    const twinkle = .82 + Math.sin(time * star.speed + star.phase) * .18;

    const seen = discovered.has(index);
    const size = Math.max(star.radius * camera.zoom, 1.1);

    ctx.save();

    ctx.globalAlpha = star.brightness * twinkle;

    if (seen) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = "#39aaff";
        ctx.fillStyle = "#48baff";
    } else {
        ctx.shadowBlur = 11;
        ctx.shadowColor = "#b9dcff";
        ctx.fillStyle = "#e5f1ff";
    }

    ctx.beginPath();
    ctx.arc(x, y, size * (seen ? 1.3 : 1), 0, Math.PI * 2);
    ctx.fill();

    if (seen) {
        ctx.shadowBlur = 0;
        drawFourPointStar(x, y, size * .85, "#72d0ff", .95);
    } else if (star.radius > 3) {
        ctx.shadowBlur = 5;
        ctx.shadowColor = "#d6eaff";
        drawFourPointStar(x, y, size * .65, "#ffffff", .8);
    }

    ctx.restore();
}

function drawMoon() {
    const dx = worldDifference(
        world.width / 2,
        camera.x,
        world.width
    );

    const dy = worldDifference(
        world.height / 2,
        camera.y,
        world.height
    );

    const x = width / 2 + dx * camera.zoom;
    const y = height / 2 + dy * camera.zoom;

    if (
        x < -100 || x > width + 100 ||
        y < -100 || y > height + 100
    ) return;

    const r = 38 * camera.zoom;

    ctx.save();

    const halo = ctx.createRadialGradient(x, y, r * .3, x, y, r * 2.5);
    halo.addColorStop(0, "rgba(174,211,255,.19)");
    halo.addColorStop(1, "rgba(100,160,230,0)");

    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 30 * camera.zoom;
    ctx.shadowColor = "rgba(159,203,255,.7)";

    const moonGradient = ctx.createLinearGradient(
        x - r, y - r, x + r, y + r
    );

    moonGradient.addColorStop(0, "#ffffff");
    moonGradient.addColorStop(.5, "#d9eaff");
    moonGradient.addColorStop(1, "#a9c9ed");

    ctx.fillStyle = moonGradient;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    ctx.globalCompositeOperation = "destination-out";

    ctx.beginPath();
    ctx.arc(
        x + r * .53,
        y - r * .32,
        r * .87,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.globalCompositeOperation = "source-over";

    ctx.restore();
}

function draw() {
    drawBackground();

    for (let i = 0; i < stars.length; i++) {
        drawStar(stars[i], i);
    }

    drawMoon();
}

function animate() {
    draw();
    requestAnimationFrame(animate);
}

function screenToWorld(x, y) {
    return {
        x: wrap(
            camera.x + (x - width / 2) / camera.zoom,
            world.width
        ),
        y: wrap(
            camera.y + (y - height / 2) / camera.zoom,
            world.height
        )
    };
}

function findStar(x, y) {
    const point = screenToWorld(x, y);

    let closest = -1;
    let closestDistance = 32 / camera.zoom;

    stars.forEach((star, i) => {
        const d = distance(point, star);

        if (d < closestDistance) {
            closest = i;
            closestDistance = d;
        }
    });

    return closest;
}

function isMoonClicked(x, y) {
    const point = screenToWorld(x, y);

    return distance(point, {
        x: world.width / 2,
        y: world.height / 2
    }) < 62 / camera.zoom;
}

const modal = document.getElementById("modal");
const card = document.getElementById("card");

function showModal(content) {
    card.innerHTML = `
        <button class="exit" onclick="closeModal()">×</button>
        ${content}
    `;

    modal.classList.add("show");
}

function closeModal() {
    modal.classList.remove("show");
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function openReason(index) {
    discovered.add(index);

    showModal(`
        <div class="number">#${index + 1}</div>
        <div class="reason">${escapeHTML(reasons[index])}</div>
        <div class="star-decoration">✧</div>
    `);
}

function openMoon() {
    const count = discovered.size;
    const unlocked = count === 365;

    showModal(`
        <div class="moon-icon">☾</div>

        <div class="progress-count">
            ${count} / 365
        </div>

        <div class="progress-bar">
            <div class="progress-fill"
                style="width:${count / 365 * 100}%">
            </div>
        </div>

        <button class="unlock"
            ${unlocked ? "" : "disabled"}
            onclick="openLetter()">
            ${unlocked ? "♡" : "✧"}
        </button>
    `);
}

function openLetter() {
    if (discovered.size !== 365) return;

    showModal(`
        <div class="letter">${escapeHTML(anniversaryLetter)}</div>
    `);
}

let pointers = new Map();
let lastPosition = null;
let gestureMoved = false;
let multiTouch = false;
let pinchDistance = 0;

canvas.addEventListener("pointerdown", e => {
    canvas.setPointerCapture(e.pointerId);

    pointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });

    if (pointers.size === 1) {
        lastPosition = {
            x: e.clientX,
            y: e.clientY
        };

        gestureMoved = false;
        multiTouch = false;
    }

    if (pointers.size === 2) {
        multiTouch = true;
        gestureMoved = true;

        const points = [...pointers.values()];

        pinchDistance = Math.hypot(
            points[1].x - points[0].x,
            points[1].y - points[0].y
        );
    }
});

canvas.addEventListener("pointermove", e => {
    if (!pointers.has(e.pointerId)) return;

    pointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
    });

    if (pointers.size === 1) {
        const dx = e.clientX - lastPosition.x;
        const dy = e.clientY - lastPosition.y;

        if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
            gestureMoved = true;
        }

        camera.x = wrap(
            camera.x - dx / camera.zoom,
            world.width
        );

        camera.y = wrap(
            camera.y - dy / camera.zoom,
            world.height
        );

        lastPosition = {
            x: e.clientX,
            y: e.clientY
        };
    }

    if (pointers.size === 2) {
        const points = [...pointers.values()];

        const newDistance = Math.hypot(
            points[1].x - points[0].x,
            points[1].y - points[0].y
        );

        const middleX = (points[0].x + points[1].x) / 2;
        const middleY = (points[0].y + points[1].y) / 2;

        if (pinchDistance > 0) {
            zoomAt(
                middleX,
                middleY,
                camera.zoom * newDistance / pinchDistance
            );
        }

        pinchDistance = newDistance;
    }
});

canvas.addEventListener("pointerup", e => {
    if (!pointers.has(e.pointerId)) return;

    if (
        pointers.size === 1 &&
        !gestureMoved &&
        !multiTouch
    ) {
        if (isMoonClicked(e.clientX, e.clientY)) {
            openMoon();
        } else {
            const index = findStar(e.clientX, e.clientY);

            if (index !== -1) {
                openReason(index);
            }
        }
    }

    pointers.delete(e.pointerId);

    if (pointers.size === 1) {
        const remaining = [...pointers.values()][0];

        lastPosition = { ...remaining };
        gestureMoved = true;
        multiTouch = true;
    }

    if (pointers.size === 0) {
        lastPosition = null;
        pinchDistance = 0;
    }
});

canvas.addEventListener("pointercancel", e => {
    pointers.delete(e.pointerId);
    lastPosition = null;
    pinchDistance = 0;
    gestureMoved = true;
});

function zoomAt(x, y, newZoom) {
    const oldZoom = camera.zoom;

    newZoom = Math.max(.65, Math.min(3, newZoom));

    const worldX = camera.x + (x - width / 2) / oldZoom;
    const worldY = camera.y + (y - height / 2) / oldZoom;

    camera.zoom = newZoom;

    camera.x = wrap(
        worldX - (x - width / 2) / newZoom,
        world.width
    );

    camera.y = wrap(
        worldY - (y - height / 2) / newZoom,
        world.height
    );
}

document.getElementById("zoomIn").addEventListener("click", () => {
    zoomAt(width / 2, height / 2, camera.zoom * 1.25);
});

document.getElementById("zoomOut").addEventListener("click", () => {
    zoomAt(width / 2, height / 2, camera.zoom / 1.25);
});

document.getElementById("home").addEventListener("click", () => {
    camera.x = world.width / 2;
    camera.y = world.height / 2;
    camera.zoom = 1;
});

canvas.addEventListener("wheel", e => {
    e.preventDefault();

    zoomAt(
        e.clientX,
        e.clientY,
        camera.zoom * (e.deltaY < 0 ? 1.1 : .9)
    );
}, { passive: false });

resize();
animate();

</script>
</body>
    </html>
